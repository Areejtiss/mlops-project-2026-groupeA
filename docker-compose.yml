# CrediScore Inclusion - local infrastructure.
# Owner: Iyed (each member adds their service through a reviewed PR).
#
# S2: MinIO, an S3-compatible object store used as the DVC remote.
# S3: MLflow tracking server (UI on http://localhost:5000), artifacts in MinIO.
# Later: API (blue/green), Prometheus, Grafana.
#
# Usage:
#   cp .env.example .env      # then fill in real values
#   docker compose up -d
#
# Image note: MinIO Inc. no longer publishes free images (minio/minio was removed
# from Docker Hub in Sept. 2026). We use the community build of the same upstream
# server by coollabs. It also ships the `mc` client, so one image serves both services.

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: crediscore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      # host:container - host ports are configurable in case 9000/9001 are taken
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API (used by DVC)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: waits for MinIO to be healthy, creates the buckets, then exits.
  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # $$ escapes $ so the variable is read inside the container, not by compose
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dvc-store &&
      mc mb --ignore-existing local/mlflow &&
      echo 'buckets dvc-store and mlflow ready'
      "
    restart: "no"

  # MLflow tracking server (T8). Run metadata in SQLite on a volume; artifacts
  # (models, curves) proxied to s3://mlflow on MinIO, so clients only need
  # MLFLOW_TRACKING_URI=http://localhost:${MLFLOW_PORT}, no S3 credentials.
  mlflow:
    build: deploy/mlflow
    image: crediscore-mlflow:3.17.2
    container_name: crediscore-mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # The MinIO root account is reused here: accepted for local use only. A
      # shared or production setup would give MLflow its own scoped MinIO user.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://mlflow --serve-artifacts
      --allowed-hosts "mlflow:5000,localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000}"
    # --allowed-hosts: MLflow 3.17 answers 403 "Invalid Host header" to any Host
    # not listed; mlflow:5000 is how other containers (the API) reach it.
    ports:
      - "${MLFLOW_PORT:-5000}:5000"   # host port configurable, like MinIO
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  # Named volumes managed by Docker: data survives `docker compose down`
  # (removed only with `docker compose down -v`).
  minio-data:
  mlflow-data:
