# CrediScore Inclusion - local infrastructure.
# Owner: Iyed (each member adds their service through a reviewed PR).
#
# S2: MinIO, an S3-compatible object store used as the DVC remote.
# Later: MLflow, API (blue/green), Prometheus, Grafana.
#
# Usage:
#   cp .env.example .env      # then fill in real values
#   docker compose up -d
#
# Image note: MinIO Inc. no longer publishes free images (minio/minio was removed
# from Docker Hub in Sept. 2026). We use the community build of the same upstream
# server by coollabs. It also ships the `mc` client, so one image serves both services.

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: crediscore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      # host:container - host ports are configurable in case 9000/9001 are taken
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API (used by DVC)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: waits for MinIO to be healthy, creates the bucket, then exits.
  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # $$ escapes $ so the variable is read inside the container, not by compose
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/dvc-store &&
      echo 'bucket dvc-store ready'
      "
    restart: "no"

volumes:
  # Named volume managed by Docker: data survives `docker compose down`
  # (removed only with `docker compose down -v`).
  minio-data:
