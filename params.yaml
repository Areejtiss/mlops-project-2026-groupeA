# CrediScore Inclusion - Contract 1: pipeline parameters.
# Owner: Areej. Read by Achraf (models) and Iyed (API schemas).
# Any change goes through a PR reviewed by the two other members.
# Loaded and validated by src/crediscore/config.py.

data:
  raw_path: data/raw/application_train.csv
  processed_dir: data/processed
  sample_size: 100000       # stratified sample (guide: <= 200k rows)
  test_size: 0.2            # 80/20 train/test split
  val_size: 0.2             # share of train held out for thresholds (D1)
  random_state: 42          # same seed everywhere = reproducible runs
  missing_threshold: 0.6    # drop columns with more than 60% missing values
  ci_sample_size: 5000      # committed fixture used by CI and CML
  holdout_size: 20000       # labelled rows outside the sample: promotion batch

id_col: SK_ID_CURR          # identifier, never a feature
target: TARGET              # 1 = payment difficulties (~8% positives)

# Kept only for the fairness audit, NEVER given to the model.
sensitive_cols:
  - CODE_GENDER

features:
  # 23 raw + 8 derived = 31 numeric features
  numeric:
    # Loan amounts: size of the commitment
    - AMT_INCOME_TOTAL
    - AMT_CREDIT
    - AMT_ANNUITY
    - AMT_GOODS_PRICE
    # External scores: strongest signals (|corr| with TARGET 0.16-0.18);
    # often missing for thin-file clients
    - EXT_SOURCE_1
    - EXT_SOURCE_2
    - EXT_SOURCE_3
    # Household
    - CNT_CHILDREN
    - CNT_FAM_MEMBERS
    # Region
    - REGION_POPULATION_RELATIVE
    - REGION_RATING_CLIENT_W_CITY
    # Stability signals (alternative data)
    - DAYS_REGISTRATION
    - DAYS_ID_PUBLISH
    - DAYS_LAST_PHONE_CHANGE
    - REG_CITY_NOT_WORK_CITY
    - LIVE_CITY_NOT_WORK_CITY
    # Contactability and documents
    - FLAG_WORK_PHONE
    - FLAG_PHONE
    - FLAG_DOCUMENT_3
    # Social circle defaults
    - OBS_30_CNT_SOCIAL_CIRCLE
    - DEF_30_CNT_SOCIAL_CIRCLE
    # Credit bureau activity and housing
    - AMT_REQ_CREDIT_BUREAU_YEAR
    - TOTALAREA_MODE
    # --- Derived features (built by the featurize stage, S3) ---
    - ANNUITY_INCOME_RATIO      # AMT_ANNUITY / AMT_INCOME_TOTAL (debt burden)
    - CREDIT_INCOME_RATIO       # AMT_CREDIT / AMT_INCOME_TOTAL
    - CREDIT_TERM               # AMT_ANNUITY / AMT_CREDIT
    - AGE_YEARS                 # -DAYS_BIRTH / 365.25 (replaces DAYS_BIRTH)
    - EMPLOYED_YEARS            # -DAYS_EMPLOYED / 365.25 (replaces DAYS_EMPLOYED)
    - DAYS_EMPLOYED_ANOM        # 1 if DAYS_EMPLOYED == 365243 (sentinel value)
    - EXT_SOURCE_MISSING_COUNT  # number of missing EXT_SOURCE (0-3)
    - IS_THIN_FILE              # 1 if little or no credit history
  # 10 categorical features
  categorical:
    - NAME_CONTRACT_TYPE
    - NAME_INCOME_TYPE
    - NAME_EDUCATION_TYPE
    - NAME_FAMILY_STATUS
    - NAME_HOUSING_TYPE
    - OCCUPATION_TYPE
    - FLAG_OWN_CAR
    - FLAG_OWN_REALTY
    - NAME_TYPE_SUITE
    - ORGANIZATION_TYPE

# Business cost (Achraf validates): a missed default costs 5x a rejected good client.
cost:
  cost_fn: 5    # false negative: default not detected
  cost_fp: 1    # false positive: good client rejected
  cost_review: 0.3  # one file sent to manual review, whatever its label (D3)

# Decision zones on the default probability (D4 codes):
#   proba < low -> ACCEPTE, low <= proba < high -> A_ETUDIER, proba >= high -> REFUSE
# The thresholds are optimized by `train` and travel with the model version
# (thresholds.json + MLflow tags, D9). low/high are an OPTIONAL MANUAL OVERRIDE:
# leave them null unless you deliberately want to force the model's thresholds.
threshold:
  low: null
  high: null
  max_review_share: 0.15  # at most 15% of files sent to review (D3)
  min_recall: 0.65        # defaults detected, review counted as detected (D8)

# Promotion gate (models/promote.py, D5): challenger vs champion on the same
# held-out batch. Gaps are acceptance-rate gaps in percentage points.
promotion:
  max_gender_gap_pts: 10  # gender raw and equal-opportunity gaps, inclusive
  age_gap_margin_pts: 2   # age equal-opportunity gap <= baseline's + this
  min_rows: 5000          # smaller batch: not promoted (gaps too noisy)
  min_group_rows: 500     # rows per gender group (XNA excluded), at least 2 groups

# Drift simulation (monitoring/simulator.py), used to test drift detection.
drift:
  seed: 7                   # same seed -> same drifted batch
  economic_crisis:
    income_factor: 0.8      # incomes drop by 20%
    credit_factor: 1.25     # loans (credit and annuity) grow by 25%
    employment_factor: 0.7  # employment seniority shrinks by 30% (job losses)
    noise_std: 0.05         # relative gaussian noise on the shifted columns

# Drift DETECTION (monitoring/drift.py, Achraf): alert thresholds of the drift
# report (contract 4). Separate from `drift:` above, which configures the simulator.
monitoring:
  alpha: 0.05               # a feature drifts when its KS / chi2 p-value < alpha
  drift_share_alert: 0.30   # alert when >= 30% of the model features drift
  psi_alert: 0.20           # alert when the PSI of one key feature is >= 0.20
  auc_drop_alert: 0.03      # alert when reference AUC - current AUC > 0.03
  psi_bins: 10              # quantile bins of the reference for the PSI
  min_rows: 500             # smaller batches: drift_share and PSI do not raise the alert
  min_labelled: 1000        # fewer labelled current rows: auc_drop is null
  key_features:             # features whose PSI alone can raise the alert
    - AMT_INCOME_TOTAL
    - AMT_CREDIT
    - ANNUITY_INCOME_RATIO
    - EXT_SOURCE_2
