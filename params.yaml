# CrediScore Inclusion - Contract 1: pipeline parameters.
# Owner: Areej. Read by Achraf (models) and Iyed (API schemas).
# Any change goes through a PR reviewed by the two other members.
# Loaded and validated by src/crediscore/config.py.

data:
  raw_path: data/raw/application_train.csv
  processed_dir: data/processed
  sample_size: 100000       # stratified sample (guide: <= 200k rows)
  test_size: 0.2            # 80/20 train/test split
  random_state: 42          # same seed everywhere = reproducible runs
  missing_threshold: 0.6    # drop columns with more than 60% missing values
  ci_sample_size: 5000      # committed fixture used by CI and CML

id_col: SK_ID_CURR          # identifier, never a feature
target: TARGET              # 1 = payment difficulties (~8% positives)

# Kept only for the fairness audit, NEVER given to the model.
sensitive_cols:
  - CODE_GENDER

features:
  # 23 raw + 8 derived = 31 numeric features
  numeric:
    # Loan amounts: size of the commitment
    - AMT_INCOME_TOTAL
    - AMT_CREDIT
    - AMT_ANNUITY
    - AMT_GOODS_PRICE
    # External scores: strongest signals (|corr| with TARGET 0.16-0.18);
    # often missing for thin-file clients
    - EXT_SOURCE_1
    - EXT_SOURCE_2
    - EXT_SOURCE_3
    # Household
    - CNT_CHILDREN
    - CNT_FAM_MEMBERS
    # Region
    - REGION_POPULATION_RELATIVE
    - REGION_RATING_CLIENT_W_CITY
    # Stability signals (alternative data)
    - DAYS_REGISTRATION
    - DAYS_ID_PUBLISH
    - DAYS_LAST_PHONE_CHANGE
    - REG_CITY_NOT_WORK_CITY
    - LIVE_CITY_NOT_WORK_CITY
    # Contactability and documents
    - FLAG_WORK_PHONE
    - FLAG_PHONE
    - FLAG_DOCUMENT_3
    # Social circle defaults
    - OBS_30_CNT_SOCIAL_CIRCLE
    - DEF_30_CNT_SOCIAL_CIRCLE
    # Credit bureau activity and housing
    - AMT_REQ_CREDIT_BUREAU_YEAR
    - TOTALAREA_MODE
    # --- Derived features (built by the featurize stage, S3) ---
    - ANNUITY_INCOME_RATIO      # AMT_ANNUITY / AMT_INCOME_TOTAL (debt burden)
    - CREDIT_INCOME_RATIO       # AMT_CREDIT / AMT_INCOME_TOTAL
    - CREDIT_TERM               # AMT_ANNUITY / AMT_CREDIT
    - AGE_YEARS                 # -DAYS_BIRTH / 365.25 (replaces DAYS_BIRTH)
    - EMPLOYED_YEARS            # -DAYS_EMPLOYED / 365.25 (replaces DAYS_EMPLOYED)
    - DAYS_EMPLOYED_ANOM        # 1 if DAYS_EMPLOYED == 365243 (sentinel value)
    - EXT_SOURCE_MISSING_COUNT  # number of missing EXT_SOURCE (0-3)
    - IS_THIN_FILE              # 1 if little or no credit history
  # 10 categorical features
  categorical:
    - NAME_CONTRACT_TYPE
    - NAME_INCOME_TYPE
    - NAME_EDUCATION_TYPE
    - NAME_FAMILY_STATUS
    - NAME_HOUSING_TYPE
    - OCCUPATION_TYPE
    - FLAG_OWN_CAR
    - FLAG_OWN_REALTY
    - NAME_TYPE_SUITE
    - ORGANIZATION_TYPE

# Business cost (Achraf validates): a missed default costs 5x a rejected good client.
cost:
  cost_fn: 5    # false negative: default not detected
  cost_fp: 1    # false positive: good client rejected

# Decision zones on the default probability (Achraf fills them in S3):
#   proba < low -> ACCEPTE, low <= proba < high -> A ETUDIER, proba >= high -> REFUSE
threshold:
  low: null
  high: null
