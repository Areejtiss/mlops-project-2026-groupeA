[project]
name = "crediscore"
version = "0.1.0"
description = "CrediScore Inclusion: explainable credit scoring MLOps platform for financial inclusion"
authors = [
    { name = "Areej Tiss" },
    { name = "Achraf Gharbi" },
    { name = "Iyed Ouerghi" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "pyarrow (>=17)",
    "pyyaml (>=6.0,<7.0)",
    "pydantic (>=2.8,<3.0)",
    "kaggle (>=1.6)",
    "dvc[s3] (>=3.55,<4.0)",
]

[tool.poetry]
packages = [{ include = "crediscore", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = ">=5.0"
black = ">=24.8"
flake8 = "^7.1"
mypy = "^1.11"
pre-commit = ">=3.8"
types-PyYAML = "^6.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Libraries without type hints
module = ["kaggle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
